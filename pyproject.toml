[project]
name = "benchmarking-molecular-models"
version = "0.1.0"
description = "Benchmarking framework for local PyTorch and HuggingFace molecular models"
readme = "readme.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "rdkit>=2023.3.1",
    "ogb>=1.3.6",
    "pytdc>=0.4.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0,<2.0.0",
    "safetensors>=0.4.0",
    "selfies>=2.1.1",
    "setuptools<70.0.0",
]

[dependency-groups]
dev = []

